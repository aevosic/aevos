[package]
name = "aevos-hq"
version = "0.1.0"
edition = "2021"
description = "Lightweight local-first Rust server, native macOS WKWebView desktop app & deposit CLI for Aevos HQ"

[dependencies]
muda = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tao = "0.34"
wry = "0.53"

[profile.release]
opt-level = 2
strip = true
